name: release

# Versiya tegi (v0.3.2) qo'yilganda: build.yml Linux .deb (IBus + Fcitx5), macOS .pkg va MSI ni yig'adi va ularga SLSA
# build provenance + SBOM attestation'ini yozadi (SLSA Build L3, imzolovchi = build.yml). Reliz faqat attestation'ni
# shu teg uchun build.yml imzolagani tekshirilgandan keyin yaratiladi.
#
# Qo'lda (Actions -> release -> Run workflow) = sinov: hammasi yig'iladi, attestation yoziladi va tekshiriladi, lekin
# reliz yaratilmaydi va e'lon yuborilmaydi. Reliz zanjiridagi o'zgarishni teg qo'ymasdan sinash uchun.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Cargo.toml dagi versiya (masalan 0.3.1); reliz yaratilmaydi"
        type: string
        required: true

permissions:
  contents: read

jobs:
  meta:
    runs-on: ubuntu-24.04
    permissions: {}
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        env:
          EVENT: ${{ github.event_name }}
          INPUT: ${{ inputs.version }}
        run: |
          if [ "$EVENT" = push ]; then v="${GITHUB_REF_NAME#v}"; else v="${INPUT#v}"; fi
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "versiya noto'g'ri: $v"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

  build:
    needs: meta
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.meta.outputs.version }}
    secrets:
      BITG_SIGN_PFX: ${{ secrets.BITG_SIGN_PFX }}
      BITG_SIGN_PFX_PASSWORD: ${{ secrets.BITG_SIGN_PFX_PASSWORD }}

  verify:
    # Foydalanuvchi va bitg.uz deploy'i bajaradigan tekshiruvning o'zi: imzolovchi build.yml, manba shu ref,
    # GitHub runner. Bittasi o'tmasa reliz yaratilmaydi.
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rel-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: oci
          path: oci
      # Image digest = OCI index blob'ining sha256, shuning uchun blob faylining o'zi tekshiriladi (registry kerak emas)
      - name: gh attestation verify (OCI image)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          mkdir -p oci/x && tar -xf oci/*-oci.tar -C oci/x
          d=$(jq -r '.manifests[0].digest' oci/x/index.json)
          echo "image digest: $d"
          for p in https://slsa.dev/provenance/v1 https://spdx.dev/Document/v2.3; do
            gh attestation verify "oci/x/blobs/sha256/${d#sha256:}" -R "$REPO" --predicate-type "$p" \
              --signer-workflow "$REPO/.github/workflows/build.yml" --source-ref "$REF" --deny-self-hosted-runners
          done
      - name: gh attestation verify (onlayn, bundle bilan, SBOM)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          cd dist
          ls -l
          signer="$REPO/.github/workflows/build.yml"
          for f in ./*.msi ./*.deb ./*.pkg; do
            gh attestation verify "$f" -R "$REPO" --signer-workflow "$signer" --source-ref "$REF" --deny-self-hosted-runners
            gh attestation verify "$f" -R "$REPO" --signer-workflow "$signer" --source-ref "$REF" --deny-self-hosted-runners \
              --bundle ./*.intoto.jsonl
            gh attestation verify "$f" -R "$REPO" --signer-workflow "$signer" --source-ref "$REF" --deny-self-hosted-runners \
              --predicate-type https://spdx.dev/Document/v2.3
          done

  publish:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rel-*
          path: dist
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          n=$(ls | wc -l)
          # MSI + sha256, 2 deb + 2 sha256, pkg + sha256, SBOM, provenance va SBOM bundle'lari
          [ "$n" -eq 11 ] || { ls -l; echo "reliz fayllari 11 ta bo'lishi kerak, bor: $n"; exit 1; }
          gh release create "$TAG" ./* -R "$REPO" --title "bitg ${TAG#v}" --generate-notes --verify-tag

  image:
    # Tekshirilgan OCI image'ni o'zgartirmasdan (digest saqlanadi) ghcr.io/dtwinuz/bitg ga yuboradi: <versiya> va latest
    if: github.event_name == 'push'
    needs: [meta, verify]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      attestations: read
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/bitg
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: oci
          path: oci
      - name: ghcr.io
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          echo "$GH_TOKEN" | skopeo login ghcr.io -u "$ACTOR" --password-stdin
          skopeo copy --all --preserve-digests "oci-archive:oci/bitg-$VERSION-oci.tar" "docker://$IMAGE:$VERSION"
          skopeo copy --all --preserve-digests "docker://$IMAGE:$VERSION" "docker://$IMAGE:latest"
          gh attestation verify "oci://$IMAGE:$VERSION" -R "$REPO" \
            --signer-workflow "$REPO/.github/workflows/build.yml" --source-ref "$REF" --deny-self-hosted-runners

  announce:
    if: github.event_name == 'push'
    needs: publish
    permissions:
      contents: read
    uses: ./.github/workflows/announce.yml
    with:
      version: ${{ github.ref_name }}
    secrets:
      BITG_DEVBOT_TOKEN: ${{ secrets.BITG_DEVBOT_TOKEN }}
